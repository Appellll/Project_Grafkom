<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Nightmares - The Maw (WebGL)</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #e8e6dc;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #mycanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .fx { position: fixed; inset: 0; pointer-events: none; }
    #vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.78) 100%); z-index: 2; }
    #grain { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; opacity: .07; mix-blend-mode: overlay; pointer-events: none; z-index: 2; }
    .bar { position: fixed; left: 0; right: 0; height: 7%; background: #000; z-index: 3; pointer-events: none; }
    #barTop { top: 0; } #barBot { bottom: 0; }
    #fade { background: #000; opacity: 1; z-index: 4; }
    #titleCard { position: fixed; left: 0; right: 0; top: 38%; text-align: center; z-index: 5; opacity: 0; pointer-events: none; text-shadow: 0 2px 14px #000; }
    #tKick { letter-spacing: .5em; font-size: 13px; color: #c9a24a; }
    #tText { font-family: Georgia, serif; font-size: clamp(28px, 5vw, 56px); margin-top: 6px; color: #efe6cf; }
    #caption { position: fixed; left: 8%; right: 8%; bottom: 11%; text-align: center; z-index: 5; font-size: clamp(14px, 1.7vw, 20px);
      text-shadow: 0 1px 8px #000, 0 0 3px #000; opacity: 0; transition: opacity .4s; pointer-events: none; }
      
    #titleCard, #caption { display: none !important; }
    
    .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: linear-gradient(transparent, rgba(0,0,0,.75)); font-size: 12px; }
    .panel input[type=range] { accent-color: #c9a24a; }
    #seek { flex: 1; min-width: 160px; }
    button { font: inherit; font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; color: #e8e6dc; background: #2a2e35; border: 1px solid #3a3f48; }
    button:hover { background: #343944; } button.on { background: #c9a24a; color: #1b1b12; border-color: #c9a24a; }
    #shot { opacity: .6; min-width: 150px; } #time { min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; }
    #loading, #startCard { position: fixed; z-index: 9; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #0a0907; }
    #startCard { z-index: 8; }
    #startCard h1 { margin: 0; font-family: Georgia, serif; color: #c9a24a; font-weight: normal; letter-spacing: .08em; }
    #startCard p { margin: 0; opacity: .6; font-size: 13px; max-width: 420px; text-align: center; }
    #startBtn { font-size: 16px; padding: 10px 26px; background: #c9a24a; color: #1b1b12; border: 0; }
  </style>
</head>
<body>
  <canvas id="mycanvas"></canvas>
  <div id="vignette" class="fx"></div>
  <canvas id="grain" width="128" height="128"></canvas>
  <div id="barTop" class="bar"></div><div id="barBot" class="bar"></div>
  <div id="titleCard"><div id="tKick"></div><div id="tText"></div></div>
  <div id="caption"></div>
  <div id="fade" class="fx"></div>

  <div class="panel">
    <button id="btnPlay">Putar</button>
    <button id="btnRestart">Mulai dari awal</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00 / 1:40</span>
    <span id="shot"></span>
    <button id="btnMute">Suara: hidup</button>
    <button id="btnCam" title="Drag = putar, scroll = zoom">Kamera bebas</button>
    <label>Terang <input id="bright" type="range" min="0.5" max="3" step="0.05" value="0.95"></label>
  </div>

  <div id="startCard">
    <h1>LITTLE NIGHTMARES</h1>
    <button id="startBtn">Mulai Animasi</button>
  </div>
  <div id="loading">Menyiapkan scene karakter&hellip;</div>

  <script src="libs.js"></script>
  <script src="csg.js"></script>
  <script src="Primitives.js"></script>
  <script src="Char/six.js"></script>
  <script src="Char/Mono.js"></script>
  <script src="Char/janitor.js"></script>
  <script src="GL.js"></script>
  <script src="env.js"></script>
  <script src="sfx.js"></script>
  <script src="animGL.js"></script>
  <script src="main.js"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        try { initScene(); }
        catch (error) { console.error(error); document.getElementById('loading').textContent = 'Gagal memuat scene: ' + error.message; }
      }, 40);
    });
  </script>
</body>
</html>
